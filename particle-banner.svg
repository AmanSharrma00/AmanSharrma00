<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="dotBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2E9EF7"/>
    </radialGradient>
    <radialGradient id="dotPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9F2EF7"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#bgFade)"/>

  <!-- floating particles: circles drift upward and fade, looping -->
  <g>
    <circle cx="40"   cy="170" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="170;10;170" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95"   cy="160" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="160;5;160" dur="9s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150"  cy="175" r="4"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="175;15;175" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210"  cy="150" r="2.5" fill="url(#dotPurple)">
      <animate attributeName="cy" values="150;0;150" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270"  cy="170" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="170;20;170" dur="10s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330"  cy="165" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="165;10;165" dur="7.5s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390"  cy="175" r="3.5" fill="url(#dotBlue)">
      <animate attributeName="cy" values="175;15;175" dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450"  cy="155" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="155;5;155" dur="9.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510"  cy="170" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="170;10;170" dur="7s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570"  cy="160" r="2.5" fill="url(#dotPurple)">
      <animate attributeName="cy" values="160;0;160" dur="8.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="8.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630"  cy="175" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="175;15;175" dur="6.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690"  cy="150" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="150;5;150" dur="9s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750"  cy="168" r="4"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="168;10;168" dur="7.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810"  cy="158" r="2.5" fill="url(#dotPurple)">
      <animate attributeName="cy" values="158;0;158" dur="8s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870"  cy="172" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="172;12;172" dur="6.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930"  cy="162" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="162;5;162" dur="9.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="9.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990"  cy="176" r="3.5" fill="url(#dotBlue)">
      <animate attributeName="cy" values="176;18;176" dur="7.8s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="155" r="2"  fill="url(#dotPurple)">
      <animate attributeName="cy" values="155;0;155" dur="8.3s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8.3s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="170" r="3"  fill="url(#dotBlue)">
      <animate attributeName="cy" values="170;10;170" dur="6.9s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="160" r="2.5" fill="url(#dotPurple)">
      <animate attributeName="cy" values="160;5;160" dur="8.7s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8.7s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- centered glowing text -->
  <text x="600" y="98" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="34" font-weight="700" fill="#ffffff">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    Building in the open ✦ Full Stack &amp; MERN
  </text>
</svg>
