<svg width="835" height="14" viewBox="0 0 835 14" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glowBarTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9EF7"/>
      <stop offset="50%" stop-color="#9F2EF7"/>
      <stop offset="100%" stop-color="#2E9EF7"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-835 0; 835 0; -835 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlowTop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2">
        <animate attributeName="stdDeviation" values="1;3.5;1" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
  </defs>
  <rect x="0" y="5" width="835" height="4" rx="2" fill="url(#glowBarTop)" filter="url(#softGlowTop)"/>
</svg>
