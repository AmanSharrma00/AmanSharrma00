<svg width="835" height="215" viewBox="0 0 835 215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="2;7;2" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9EF7">
        <animate attributeName="stop-color" values="#2E9EF7;#9F2EF7;#2E9EF7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9F2EF7">
        <animate attributeName="stop-color" values="#9F2EF7;#2E9EF7;#9F2EF7" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- glowing animated border -->
  <rect x="6" y="6" width="823" height="203" rx="14" ry="14"
        fill="none" stroke="url(#borderGradient)" stroke-width="3"
        filter="url(#neonGlow)"/>

  <!-- the actual streak stats image, embedded inside the frame -->
  <image href="https://streak-stats.demolab.com/?user=AmanSharrma00&amp;theme=radical&amp;hide_border=true&amp;background=0D1117"
         x="18" y="18" width="799" height="179"/>
</svg>
